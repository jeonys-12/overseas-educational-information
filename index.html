<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="해외사업본부 교육제도와 교육 신청절차를 안내합니다."
    />
    <meta name="theme-color" content="#292d32" />
    <title>해외사업본부 교육정보</title>
    <link rel="icon" href="assets/hanwha-mark.svg?v=20260729" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css?v=20260730-3" />
    <script src="script.js?v=20260730-3" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문 바로가기</a>

    <header class="site-header" id="top">
      <div class="header-inner">
        <a class="brand" href="#top" aria-label="교육정보 홈">
          <span class="brand-mark">
            <img src="assets/hanwha-mark.svg?v=20260729" alt="" />
          </span>
          <span class="brand-copy">
            <strong id="brand-title">해외사업본부</strong>
            <small id="brand-subtitle">EDUCATION GUIDE</small>
          </span>
        </a>
        <nav class="primary-nav" id="primary-nav" aria-label="주요 메뉴"></nav>
      </div>
    </header>

    <main id="main-content">
      <section class="hero" aria-labelledby="hero-title">
        <div class="page-width">
          <span class="eyebrow" id="hero-eyebrow"></span>
          <h1 id="hero-title"></h1>
          <p id="hero-description"></p>
        </div>
      </section>

      <div class="page-width content-stack">
        <section class="content-section" id="system">
          <div class="section-heading" id="system-heading"></div>
          <article class="direction-card" id="direction-card"></article>
          <div class="card-list" id="system-list"></div>
          <div class="term-note" id="term-note"></div>
        </section>

        <section class="content-section" id="application">
          <div class="section-heading" id="application-heading"></div>
          <ol class="step-list" id="application-list"></ol>
        </section>

        <section class="content-section" id="programs">
          <div class="section-heading" id="programs-heading"></div>
          <div class="program-tools">
            <label class="search-box">
              <span class="sr-only">교육 검색</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m21 21-4.35-4.35m2.35-5.4A7.75 7.75 0 1 1 3.5 11.25a7.75 7.75 0 0 1 15.5 0Z" />
              </svg>
              <input id="program-search" type="search" autocomplete="off" />
            </label>
            <div class="filter-list" id="filter-list" role="group" aria-label="교육 분야 필터"></div>
          </div>
          <p class="result-count" id="result-count" aria-live="polite"></p>
          <div class="program-list" id="program-list"></div>
          <div class="empty-state" id="empty-state" hidden></div>
        </section>

        <section class="content-section" id="faq">
          <div class="section-heading" id="faq-heading"></div>
          <div class="faq-list" id="faq-list"></div>
        </section>

        <section class="content-section" id="contact">
          <div class="section-heading" id="contact-heading"></div>
          <div class="contact-card" id="contact-list"></div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="page-width">
        <strong id="footer-title"></strong>
        <span id="footer-note"></span>
        <a href="#top">맨 위로 ↑</a>
      </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
